name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Yeni yayınlanan CVE'leri yakalamak için her pazartesi 09:00 (TR) tekrar tarar
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    name: Tip kontrolü ve derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker imajı ve duman testi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t gbt-web .
      - name: Konteyneri başlat ve temel uçları dene
        run: |
          docker run -d --name gbt -p 3001:3001 -e ADMIN_PASSWORD=ci-test-password-123 gbt-web
          for i in $(seq 1 30); do curl -fs http://localhost:3001/api/config && break; sleep 1; done
          curl -fs http://localhost:3001/ | grep -q "Genç Bilişimciler"
          curl -fs -o /dev/null http://localhost:3001/admin/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/admin/suggestions)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3001/api/suggestions \
            -H 'Content-Type: application/json' -d '{"topics":["Hackathon"]}')" = 201
      - if: failure()
        run: docker logs gbt || true

      - name: CVE taraması — tüm bulgular (bilgi amaçlı)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --scanners vuln --no-progress gbt-web
      - name: CVE taraması — düzeltmesi olan YÜKSEK/KRİTİK açık varsa başarısız ol
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --scanners vuln --no-progress --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 gbt-web
